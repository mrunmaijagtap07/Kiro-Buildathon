<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CampusArchive{% endblock %}</title>

  <script>
    (function(){
      var t = localStorage.getItem('ca-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--color-bg);
      position: relative;
    }
    .auth-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(184, 137, 47, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(7, 59, 43, 0.04) 0%, transparent 50%);
      pointer-events: none;
    }
    .auth-container { width: 100%; max-width: 480px; position: relative; z-index: 1; }
    .auth-header { text-align: center; margin-bottom: 36px; }
    .auth-logo { 
      display: inline-flex; 
      align-items: center; 
      gap: 12px; 
      font-weight: 800; 
      font-size: 1.25rem; 
      font-family: 'Playfair Display', serif;
      color: var(--color-text); 
      margin-bottom: 20px; 
      text-decoration: none; 
      letter-spacing: -0.01em;
    }
    .auth-logo-icon { 
      width: 44px; 
      height: 44px; 
      background: linear-gradient(135deg, var(--color-primary) 0%, #0A3D2E 100%);
      color: white; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.3rem;
      box-shadow: 0 4px 12px rgba(7, 59, 43, 0.15);
    }
    .auth-title { 
      font-family: 'Playfair Display', serif;
      font-size: 2rem; 
      font-weight: 900; 
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      color: var(--color-text);
    }
    .auth-subtitle { 
      color: var(--color-text-muted); 
      font-size: 1rem;
      font-weight: 500;
    }
    .auth-card { 
      background: var(--color-surface); 
      border: 1.5px solid var(--color-border); 
      border-radius: 16px; 
      padding: 40px; 
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }
    .auth-divider { 
      display: flex; 
      align-items: center; 
      gap: 14px; 
      margin: 24px 0; 
    }
    .auth-divider::before, .auth-divider::after { 
      content:''; 
      flex:1; 
      height:1px; 
      background: var(--color-border); 
    }
    .auth-divider span { 
      font-size: .85rem; 
      color: var(--color-text-muted);
      font-weight: 600;
    }
    .auth-footer { 
      text-align: center; 
      margin-top: 24px; 
      font-size: .9rem; 
      color: var(--color-text-muted); 
    }
    .google-btn {
      width: 100%;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 12px;
      padding: 13px 24px;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-surface);
      color: var(--color-text);
      font-size: .95rem; 
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .google-btn:hover { 
      border-color: var(--color-primary); 
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      transform: translateY(-1px);
      color: var(--color-text); 
    }
    .google-btn .google-logo { width: 20px; height: 20px; }
    .theme-corner {
      position: fixed; 
      top: 20px; 
      right: 20px;
      z-index: 100;
    }
    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
      .auth-title { font-size: 1.75rem; }
    }
  </style>
</head>
<body>

<button class="theme-toggle theme-corner" aria-label="Toggle theme"><span class="theme-icon-moon"><span class="ca-icon ca-icon-moon" aria-hidden="true"></span></span><span class="theme-icon-sun hidden"><span class="ca-icon ca-icon-sun" aria-hidden="true"></span></span></button>

<div class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <a href="{{ url_for('main.home') }}" class="auth-logo">
        <img src="{{ url_for('static', filename='icons/campusarchive-crest.svg') }}" alt="" class="brand-crest">
        <span class="brand-copy"><strong>CampusArchive</strong><small>Preserve. Discover. Build.</small></span>
      </a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} mb-3" role="alert">
          <span>{{ message }}</span>
          <button class="alert-close" aria-label="Dismiss"><span aria-hidden="true">×</span></button>
        </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</div>

<div id="toast-container" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
